name: Web3 Job Scraper

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 feedparser lxml

      # seen_jobs.json now lives in the repo itself (committed by the
      # final step below), so the dedup store is durable across runs.
      # The checkout above already brought it down.

      - name: Run job scraper
        run: python web3_job_scraper.py > jobs_digest.txt

      - name: Send jobs to Telegram
        run: |
          python - <<'EOF'
          import urllib.request, json, os

          token = os.environ['TELEGRAM_TOKEN']
          chat_id = os.environ['TELEGRAM_CHAT_ID']
          body = open("jobs_digest.txt").read().strip()

          if not body or "No new jobs" in body:
              print("No new jobs to send")
              exit(0)

          # Split on blank lines (job boundaries) so we never cut inside an HTML tag.
          # Accumulate complete job blocks until we'd exceed 4000 chars, then send.
          import time
          blocks = body.split("\n\n")
          chunk = ""
          sent = 0
          for block in blocks:
              candidate = (chunk + "\n\n" + block).strip() if chunk else block
              if len(candidate) > 4000:
                  if chunk.strip():
                      data = json.dumps({
                          "chat_id": chat_id,
                          "text": chunk.strip(),
                          "parse_mode": "HTML",
                          "disable_web_page_preview": True
                      }).encode()
                      req = urllib.request.Request(
                          f"https://api.telegram.org/bot{token}/sendMessage",
                          data=data,
                          headers={"Content-Type": "application/json"}
                      )
                      urllib.request.urlopen(req)
                      sent += 1
                      time.sleep(0.5)
                  chunk = block
              else:
                  chunk = candidate
          if chunk.strip():
              data = json.dumps({
                  "chat_id": chat_id,
                  "text": chunk.strip(),
                  "parse_mode": "HTML",
                  "disable_web_page_preview": True
              }).encode()
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data=data,
                  headers={"Content-Type": "application/json"}
              )
              urllib.request.urlopen(req)
              sent += 1
          print(f"Jobs sent in {sent} message(s)!")
          EOF
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit digest + seen-jobs back to repo
        # Persist jobs_digest.txt so the Patch app can pull the latest run
        # from raw.githubusercontent.com. Also commit seen_jobs.json so the
        # dedup store survives between runs (replaces the brittle GitHub
        # Actions cache that used to evict and resurface old jobs as new).
        # No-op if neither file changed.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs_digest.txt seen_jobs.json
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Update jobs digest + seen-jobs [skip ci]"
          git push
