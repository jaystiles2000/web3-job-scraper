# BD Trigger Watcher — watchlist.
#
# Add/remove companies here. Structure per entry:
#   name:      Human-readable canonical name (used in Telegram alert)
#   ats:       null on first entry (discovery fills it in), then one of:
#              greenhouse | lever | ashby | none
#   ats_id:    Slug/token used by the ATS API (discovery fills)
#   aliases:   Extra strings to match against on the jobs.solana.com
#              fallback (case-insensitive). Add rename history, parent-co,
#              etc. Optional.
#   priority:  normal | high. `high` also alerts on weekends. Default normal.
#
# Discovery: run the workflow with `mode: discover` to fill in ats/ats_id
# for any entry where ats is null. Re-run any time you paste new companies.
#
# Removing a company: just delete the entry. Its state (last alert time,
# seen jobs) will be garbage-collected on the next run.

